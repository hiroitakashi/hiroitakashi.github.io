<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Yellowman（廣居隆史）の書斎 — 歴史小説、SUNOで作った曲、写真、YouTube。">
<style>body{margin:0}img{max-width:100%}</style>
<title>Yellowmanの書斎</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Tinos&family=Yuji+Boku&display=swap">
<style id="page-style">
/* Layout: 縦書きの名を掲げた藍の扉から、作品・写真・映像の三つの間へ降りていく一枚の書斎 */
:root{
  --paper:#ffffff; --surface:#f7f7f5; --ink:#1d2328; --muted:#5d666d; --rule:#cfd4d2;
  --ai:#24476b; --ai-soft:#dfe6ee; --shu:#a8402e;
  --f-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --step-1:clamp(.82rem,.8rem + .1vw,.88rem); --step0:1rem; --step1:1.25rem; --step2:clamp(1.5rem,1.3rem + .9vw,2rem); --step3:clamp(2.4rem,1.8rem + 3vw,4.2rem);
}
:root{color-scheme:light}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:var(--step0);line-height:1.8}
a{color:var(--ai)}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--ai);outline-offset:3px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;font-weight:700}

/* 扉 */
.top{display:grid;grid-template-columns:clamp(220px,22vw,280px) 1fr;min-height:min(88vh,860px);padding-block:clamp(24px,4vw,56px)}
.side{display:flex;flex-direction:column;align-items:center;text-align:center;gap:clamp(36px,6vh,72px);padding:clamp(24px,5vh,56px) 24px;border-right:1px solid var(--rule);min-width:0}
.name{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(1.5rem,1.2rem + .9vw,1.9rem);letter-spacing:.2em;line-height:1.3;color:var(--ink)}
.name small{display:block;font-family:var(--f-body);font-size:.4em;font-weight:400;letter-spacing:.3em;color:var(--muted);margin-top:.9em}
.name{letter-spacing:0;font-size:clamp(1.45rem,1.1rem + 1vw,1.95rem);overflow-wrap:normal}
.name .tail{white-space:nowrap}
.name .yman{font-family:"Times New Roman",Times,"Tinos",serif;font-style:normal;font-weight:400;font-size:1.12em;letter-spacing:.02em}
.name .no{font-family:var(--f-display);font-weight:500;font-size:.62em;margin:0 .12em}
.name .shosai{font-family:"衡山毛筆フォント草書","KouzanSousho","青柳草書","AoyagiSosho","Yuji Boku",var(--f-display);font-weight:400;font-size:1.05em;letter-spacing:.04em}
.side .lead{margin:-18px 0 0;font-size:.78rem;color:var(--muted);line-height:2;max-width:15em}
nav.rooms{display:grid;gap:4px;margin-block:auto}
nav.rooms a{text-decoration:none;color:var(--ink);font-family:var(--f-display);font-weight:500;font-size:.98rem;letter-spacing:.24em;padding:.55em 1em;border-bottom:1px solid transparent}
nav.rooms a:hover,nav.rooms a:focus-visible{color:var(--ai);border-bottom-color:var(--ai)}
.stage{display:flex;align-items:center;justify-content:center;padding:clamp(24px,5vw,72px);min-width:0}
.hero{margin:0;width:min(100%,560px);display:grid;gap:14px}
.hero img{width:100%;aspect-ratio:3/2;object-fit:cover;display:block;background:#efe9e2}
.hero figcaption{font-size:.72rem;letter-spacing:.2em;color:var(--muted);text-align:right}

/* 間 */
section.room{padding-block:clamp(36px,5vw,64px);border-top:1px solid var(--rule)}
.room-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 24px;margin-bottom:28px}
.room-head h2{font-size:var(--step2);display:flex;align-items:baseline;gap:.6em}
.room-head h2 .kana{font-family:var(--f-body);font-size:var(--step-1);font-weight:500;letter-spacing:.2em;color:var(--ai)}
.room-head p{margin:0;color:var(--muted);font-size:var(--step-1)}

/* 作品 */
.works{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:0;border-top:1px solid var(--rule);border-left:1px solid var(--rule)}
.work{background:var(--paper);border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:22px 22px 24px;display:grid;grid-template-columns:auto 1fr;grid-auto-rows:min-content;gap:4px 20px;min-width:0}
.work .cover{grid-row:1 / span 5;align-self:start;display:block;width:clamp(96px,9vw,120px);box-shadow:0 1px 2px rgba(0,0,0,.12),0 6px 16px -6px rgba(0,0,0,.28);outline:1px solid rgba(0,0,0,.08);transition:transform .2s}
.work .cover img{display:block;width:100%;height:auto;aspect-ratio:424/600}
.work .cover:hover{transform:translateY(-3px)}
.work .wt{font-family:var(--f-display);font-weight:700;font-size:1.3rem;letter-spacing:.08em;line-height:1.35;color:var(--ink)}
.work .who{font-size:var(--step-1);color:var(--muted);letter-spacing:.06em}
.work .era{font-size:var(--step-1);color:var(--shu);letter-spacing:.06em}
.work p{margin:4px 0 0;font-size:.94rem;line-height:1.75;min-width:0}
.work .read{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.work .read a{font-size:.8rem;letter-spacing:.04em;white-space:nowrap;text-decoration:none;padding:.4em .8em;border:1px solid var(--ai);color:var(--ai);border-radius:2px}
.work .read a:first-child{background:var(--ai);color:#fff}
.work .read a:hover{opacity:.82}

/* 作曲 */
.folder{border:1px solid var(--rule);margin-bottom:14px;background:var(--paper)}
.folder>summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:14px;padding:14px 18px;background:var(--surface);border-bottom:1px solid var(--rule)}
.folder>summary::-webkit-details-marker{display:none}
.folder>summary::before{content:"";width:.55em;height:.55em;border-right:2px solid var(--ai);border-bottom:2px solid var(--ai);transform:rotate(-45deg);transition:transform .2s;align-self:center}
.folder[open]>summary::before{transform:rotate(45deg)}
.folder:not([open])>summary{border-bottom:0}
.folder .fname{font-family:var(--f-display);font-weight:700;font-size:1.2rem;letter-spacing:.14em}
.folder .fcount{font-size:var(--step-1);color:var(--muted)}
.folder .songs{border-top:0;padding:0 18px}
.folder .song:last-child{border-bottom:0}
select{font:inherit;font-size:.92rem;padding:.4em .5em;border:1px solid var(--rule);background:var(--surface);color:var(--ink);border-radius:2px}
.songs{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.song{border-bottom:1px solid var(--rule);display:grid;grid-template-columns:auto 1fr auto;gap:6px 16px;align-items:center;padding-block:14px;min-width:0}
.song .no{font-family:var(--f-display);font-size:1.1rem;color:var(--muted);font-variant-numeric:tabular-nums;width:2.2em;text-align:right}
.song .play{all:unset;text-decoration:none;cursor:pointer;display:grid;gap:2px;min-width:0}
.song .play .tt{font-family:var(--f-display);font-weight:700;font-size:1.15rem;color:var(--ink);overflow-wrap:anywhere}
.song .play:hover .tt,.song.on .tt{color:var(--ai)}
.song .play .nt{font-size:var(--step-1);color:var(--muted);overflow-wrap:anywhere}
.song .acts{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.song audio{grid-column:2 / -1;width:100%;max-width:100%}
.song .mark{display:inline-block;width:1.4em;color:var(--shu)}
.song .edit{grid-column:2 / -1;display:flex;flex-wrap:wrap;gap:6px}
.song .edit input{flex:1 1 160px}
a.btn{font-size:.9rem;font-weight:500;padding:.45em 1em;border-radius:2px;border:1px solid var(--ai);color:var(--ai);text-decoration:none}
@media (max-width:560px){.song{grid-template-columns:auto 1fr}.song .acts{grid-column:2;justify-content:flex-start}}
/* 写真 */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:12px}
.ph{margin:0;background:var(--surface);border:1px solid var(--rule);display:flex;flex-direction:column;min-width:0}
.ph button.open{all:unset;cursor:zoom-in;display:block;aspect-ratio:4/3;max-width:100%;overflow:hidden;background:var(--ai-soft)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph figcaption{padding:8px 12px 10px;font-size:var(--step-1);color:var(--muted);min-height:2.6em}
.ph .edit{display:flex;gap:6px;padding:0 10px 10px}
.ph .edit input{flex:1;min-width:0}
.empty{border:1px dashed var(--rule);padding:36px 20px;text-align:center;color:var(--muted);background:var(--surface)}
.owner{margin-top:18px;padding:16px;border:1px solid var(--ai);background:var(--ai-soft);display:grid;gap:10px}
.owner h3{font-size:1rem;font-family:var(--f-body);font-weight:700;color:var(--ai);letter-spacing:.08em}
.owner .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=text],input[type=url]{font:inherit;font-size:.92rem;padding:.45em .7em;border:1px solid var(--rule);background:var(--surface);color:var(--ink);border-radius:2px;min-width:0}
button.btn{font:inherit;font-size:.9rem;font-weight:500;padding:.45em 1em;border-radius:2px;border:1px solid var(--ai);background:var(--ai);color:var(--paper);cursor:pointer}
button.btn.ghost{background:transparent;color:var(--ai)}
button.btn.warn{background:transparent;color:var(--shu);border-color:var(--shu)}
button.btn:disabled{opacity:.5;cursor:default}
.status{font-size:var(--step-1);color:var(--muted)}

.ownerbar{position:sticky;bottom:0;z-index:5;background:var(--surface);border-top:2px solid var(--ai);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px))}
.ownerbar .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
/* コメント */
.cm-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:28px;align-items:start}
.cms{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.cm{background:var(--surface);border:1px solid var(--rule);border-left:3px solid var(--ai);padding:16px 18px;min-width:0}
.cm .hd{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;margin-bottom:6px}
.cm .nm{font-family:var(--f-display);font-weight:700;font-size:1.05rem}
.cm .ab{font-size:var(--step-1);color:var(--ai)}
.cm .dt{font-size:var(--step-1);color:var(--muted);font-variant-numeric:tabular-nums;margin-left:auto}
.cm p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.cm .reply{margin-top:10px;padding:10px 12px;background:var(--ai-soft);font-size:.94rem}
.cm .reply b{color:var(--ai);font-weight:700;margin-right:.5em}
.cm .tools{display:flex;gap:6px;margin-top:10px}
.cm-form{background:var(--surface);border:1px solid var(--rule);padding:20px;display:grid;gap:8px;min-width:0}
.cm-form h3{font-size:var(--step1);margin-bottom:4px}
.cm-form label{font-size:var(--step-1);font-weight:500;color:var(--muted);letter-spacing:.04em}
.cm-form input,.cm-form textarea{width:100%}
textarea{font:inherit;font-size:.95rem;padding:.55em .7em;border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:2px;resize:vertical;min-width:0}
.cm-form input[type=text]{background:var(--paper)}
.cm-form .row{display:flex;flex-wrap:wrap;gap:8px}
.cm-note{margin:0;font-size:var(--step-1);color:var(--muted)}
.mailbox{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;border-top:1px solid var(--rule);padding-top:12px;margin-top:4px}
.mailbox span{font-size:var(--step-1);color:var(--muted)}
.mailbox code{font-family:var(--f-body);font-weight:700;color:var(--ink);user-select:all;overflow-wrap:anywhere}
@media (max-width:760px){.cm-grid{grid-template-columns:1fr}}
/* 映像 */
.yt{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:20px;align-items:start}
.yt-card{background:var(--surface);border:1px solid var(--rule);padding:24px;display:grid;gap:14px;min-width:0}
.yt-card .ch{font-family:var(--f-display);font-size:var(--step1);font-weight:700;overflow-wrap:anywhere}
.yt-card a.go{justify-self:start;text-decoration:none;font-weight:700;letter-spacing:.08em;padding:.6em 1.4em;border:1px solid var(--shu);color:var(--shu);border-radius:2px}
.yt-card a.go:hover{background:var(--shu);color:var(--paper)}
.vids{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.vids li{display:flex;gap:10px;align-items:baseline;min-width:0;border-bottom:1px solid var(--rule);padding-bottom:8px}
.vids li a{overflow-wrap:anywhere}

/* 戻る */
.room-head{position:relative}
.backrow{order:-1;flex:0 0 100%;margin-bottom:6px}
.back{display:inline-flex;align-items:center;gap:.35em;font-size:var(--step-1);letter-spacing:.08em;text-decoration:none;color:var(--ai);padding:.3em .9em .3em .6em;border:1px solid var(--rule);border-radius:999px;background:var(--paper)}
.back span{font-size:1.4em;line-height:1;margin-top:-.12em}
.back:hover{background:var(--ai-soft)}
.totop{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:6;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;text-decoration:none;font-size:1.25rem;background:var(--ai);color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.22)}
.totop:hover{opacity:.88}
body.owner-on .totop{bottom:calc(72px + env(safe-area-inset-bottom,0px))}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}

footer{border-top:1px solid var(--rule);padding-block:28px 40px;color:var(--muted);font-size:var(--step-1)}

/* 拡大表示 */
.lb{position:fixed;inset:0;background:rgba(10,12,14,.88);display:grid;place-items:center;z-index:20;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
[hidden]{display:none !important}
.lb figure{margin:0;display:grid;gap:10px;max-width:min(1100px,100%)}
.lb img{max-height:80vh;max-width:100%;object-fit:contain;justify-self:center}
.lb figcaption{color:#e4e7e6;text-align:center;font-size:.95rem}
.lb button{justify-self:center;font:inherit;background:transparent;color:#e4e7e6;border:1px solid #e4e7e6;padding:.35em 1.2em;border-radius:2px;cursor:pointer}

@media (max-width:560px){
  .name small{display:inline;margin:0 0 0 .8em}
}
@media (max-width:900px){
  .top{display:flex;flex-direction:column;min-height:0;padding-block:max(16px,env(safe-area-inset-top)) 32px;gap:0}
  .side{display:contents}
  .name{order:0;padding:18px 0 22px;border-bottom:1px solid var(--rule);text-align:center}
  .side .lead{order:1;margin:22px auto 0;max-width:none;text-align:center}
  .stage{order:2;padding:24px 0}
  .hero{width:100%}
  nav.rooms{order:3;margin:0;border-top:1px solid var(--rule)}
  nav.rooms a{text-align:center;border-bottom:1px solid var(--rule);padding:1em}
  nav.rooms a:hover,nav.rooms a:focus-visible{border-bottom-color:var(--rule);background:var(--surface)}
}
@media (prefers-reduced-motion:no-preference){nav.rooms a,.yt-card a.go{transition:background .2s,color .2s,border-color .2s}}
</style>

</head>
<body>
<template id="tpl"><header class="wrap top" id="top">
  <div class="side">
    <h1 class="name"><span class="yman">Yellowman</span><span class="tail"><span class="no">の</span><span class="shosai">書斎</span></span></h1>
    <nav class="rooms" aria-label="カテゴリー">
      <a href="#works">小説</a>
      <a href="#songs">作曲</a>
      <a href="#photos">写真集</a>
      <a href="#youtube">YouTube</a>
      <a href="#comments">コメント</a>
    </nav>
  </div>
  <div class="stage">
    <figure class="hero"><img src="files/img-top.jpg" alt="レストランのテーブルに置かれた、オリーブ入りのグラス" fetchpriority="high"></figure>
  </div>
</header>

<main>
  <section class="room" id="works">
    <div class="wrap">
      <div class="room-head">
        <h2>小説<span class="kana">WORKS</span></h2>
        <p>十五作。いずれも縦書きの小説として書き下ろし、ドラマ脚本も用意しています。</p>
        <div class="backrow"><a class="back" href="#top" aria-label="トップへ戻る"><span aria-hidden="true">‹</span> トップへ戻る</a></div>
      </div>
      <ul class="works" id="works-list"></ul>
    </div>
  </section>

  <section class="room" id="songs">
    <div class="wrap">
      <div class="room-head">
        <h2>作曲<span class="kana">SONGS</span></h2>
        <p>SUNOで作った曲です。曲名を押すと、その場で聴けます。気に入った曲はダウンロードもできます。</p>
        <div class="backrow"><a class="back" href="#top" aria-label="トップへ戻る"><span aria-hidden="true">‹</span> トップへ戻る</a></div>
      </div>
      <div id="songs-area"></div>
      <div id="song-owner" hidden></div>
    </div>
  </section>

  <section class="room" id="photos">
    <div class="wrap">
      <div class="room-head">
        <h2>写真集<span class="kana">PHOTOGRAPHS</span></h2>
        <p>自分の目で見て、自分で撮った風景です。写真を押すと大きく見られます。</p>
        <div class="backrow"><a class="back" href="#top" aria-label="トップへ戻る"><span aria-hidden="true">‹</span> トップへ戻る</a></div>
      </div>
      <div id="gallery-area"></div>
      <div id="photo-owner" hidden></div>
    </div>
  </section>

  <section class="room" id="youtube">
    <div class="wrap">
      <div class="room-head">
        <h2>YouTube<span class="kana">CHANNEL</span></h2>
        <p>映像で綴っているチャンネルです。</p>
        <div class="backrow"><a class="back" href="#top" aria-label="トップへ戻る"><span aria-hidden="true">‹</span> トップへ戻る</a></div>
      </div>
      <div class="yt" id="yt-area"></div>
      <div id="yt-owner" hidden></div>
    </div>
  </section>
<section class="room" id="comments">
    <div class="wrap">
      <div class="room-head">
        <h2>コメント<span class="kana">LETTERS</span></h2>
        <p>小説や曲、写真へのご感想をお寄せください。いただいたコメントは、すべてこの欄で公開します。</p>
        <div class="backrow"><a class="back" href="#top" aria-label="トップへ戻る"><span aria-hidden="true">‹</span> トップへ戻る</a></div>
      </div>
      <div class="cm-grid">
        <div id="cm-list"></div>
        <form class="cm-form" id="cm-form" novalidate>
          <h3>コメントを送る</h3>
          <label for="cm-name">お名前（ニックネーム可）</label>
          <input type="text" id="cm-name" maxlength="40" autocomplete="nickname">
          <label for="cm-about">どれについて</label>
          <input type="text" id="cm-about" maxlength="60" placeholder="例：小説『波頭』">
          <label for="cm-text">コメント</label>
          <textarea id="cm-text" rows="6" maxlength="2000"></textarea>
          <p class="cm-note">送られたコメントは、お名前とともにこのページで公開されます。</p>
          <div class="row"><button class="btn" type="submit" id="cm-send">メールで送る</button><button class="btn ghost" type="button" id="cm-copy">文面をコピー</button></div>
          <p class="status" id="cm-status" aria-live="polite"></p>
          <div class="mailbox">
            <span>受付アドレス</span>
            <code id="cm-addr">hiroitakashi@gmail.com</code>
            <button class="btn ghost" type="button" id="cm-addr-copy">アドレスをコピー</button>
          </div>
          <p class="cm-note">メールソフトが開かないときは、文面をコピーして上のアドレスへお送りください。</p>
        </form>
      </div>
      <div id="cm-owner" hidden></div>
    </div>
  </section>
</main>

<footer class="wrap">© 廣居隆史　掲載の文章と写真の無断転載はご遠慮ください。</footer>

<div class="lb" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="写真の拡大表示">
  <figure><img id="lb-img" alt=""><figcaption id="lb-cap"></figcaption><button type="button" id="lb-close">閉じる</button></figure>

    if(c.reply)li.append(el("div",{class:"reply"},[el("b",{text:"廣居より"}),document.createTextNode(c.reply)]));
    if(owner){
      const rp=el("button",{class:"btn ghost",type:"button",text:c.reply?"返事を直す":"返事を書く",onclick:()=>{const box=li.querySelector(".rbox");box.hidden=!box.hidden}});
      const rm=el("button",{class:"btn warn",type:"button",text:"外す",onclick:()=>{state.comments.splice(i,1);markDirty();renderComments()}});
      const ta=el("textarea",{id:"rp-"+i,rows:"3","aria-label":"返事"});ta.value=c.reply||"";
      const ok=el("button",{class:"btn",type:"button",text:"返事を入れる",onclick:()=>{c.reply=ta.value.trim();markDirty();renderComments()}});
      const box=el("div",{class:"rbox"},[ta,el("div",{class:"tools"},[ok])]);box.hidden=true;box.style.cssText="display:grid;gap:6px;margin-top:8px";
      li.append(el("div",{class:"tools"},[rp,rm]),box);

    ul.append(li);
  });
  area.append(ul);
}
function draft(){const n=$("#cm-name").value.trim(),a=$("#cm-about").value.trim(),t=$("#cm-text").value.trim();return{n,a,t,subject:"ホームページへのコメント"+(a?"（"+a+"）":""),body:"お名前："+(n||"匿名")+"\nどれについて："+(a||"")+"\n\n"+t+"\n"}}
async function copyText(txt,st,okMsg){try{await navigator.clipboard.writeText(txt);st.textContent=okMsg}catch(e){st.textContent="コピーできませんでした。文字を選んでコピーしてください。"}}
$("#cm-form").addEventListener("submit",e=>{
  e.preventDefault();const d=draft(),st=$("#cm-status");
  if(!d.t){st.textContent="コメントを書いてから送ってください。";$("#cm-text").focus();return}
  const a=el("a",{href:"mailto:"+ADDR+"?subject="+encodeURIComponent(d.subject)+"&body="+encodeURIComponent(d.body)});document.body.append(a);a.click();a.remove();
  st.textContent="メールソフトで送信してください。開かない場合は「文面をコピー」で "+ADDR+" へお送りください。";
});
$("#cm-copy").addEventListener("click",()=>{const d=draft(),st=$("#cm-status");if(!d.t){st.textContent="コメントを書いてからコピーしてください。";return}copyText("件名："+d.subject+"\n"+d.body,st,"文面をコピーしました。"+ADDR+" 宛てのメールに貼り付けて送ってください。")});
$("#cm-addr-copy").addEventListener("click",()=>copyText(ADDR,$("#cm-status"),"アドレスをコピーしました。"));
function renderCommentOwner(){
  const co=$("#cm-owner");co.hidden=false;co.replaceChildren();
  const nm=el("input",{type:"text",id:"oc-name",placeholder:"お名前","aria-label":"お名前"});
  const ab=el("input",{type:"text",id:"oc-about",placeholder:"どれについて","aria-label":"どれについて"});
  const dt=el("input",{type:"text",id:"oc-date",placeholder:"日付","aria-label":"日付"});
  const d=new Date();dt.value=d.getFullYear()+"年"+(d.getMonth()+1)+"月"+d.getDate()+"日";
  const tx=el("textarea",{id:"oc-text",rows:"4",placeholder:"届いたコメントを貼り付け","aria-label":"コメント"});
  const st=el("span",{class:"status"});
  const add=el("button",{class:"btn",type:"button",text:"コメントを公開欄に加える",onclick:()=>{if(!tx.value.trim()){tx.focus();return}state.comments.unshift({name:nm.value.trim()||"匿名",about:ab.value.trim(),date:dt.value.trim(),text:tx.value.trim(),reply:""});nm.value="";ab.value="";tx.value="";markDirty();renderComments();st.textContent="加えました。「変更を保存して公開」で公開されます。"}});
  co.append(el("div",{class:"owner"},[el("h3",{text:"届いたコメントを載せる（あなただけに表示）"}),el("div",{class:"row"},[nm,ab,dt]),tx,el("div",{class:"row"},[add]),st]));
}

/* 持ち主だけの編集欄 */
const saveBtn=el("button",{class:"btn",type:"button",text:"変更を保存して公開",disabled:"",onclick:save});
const saveStatus=el("span",{class:"status",text:""});
function markDirty(){dirty=true;saveBtn.removeAttribute("disabled");saveStatus.textContent="保存していない変更があります。"}

function renderOwner(){
  const po=$("#photo-owner");po.hidden=false;po.replaceChildren();
  const file=el("input",{type:"file",id:"photo-file",accept:"image/*",multiple:""});
  const st=el("span",{class:"status"});
  file.addEventListener("change",async()=>{
    const fs=[...file.files];if(!fs.length)return;
    file.disabled=true;
    for(let i=0;i<fs.length;i++){
      st.textContent=`アップロード中… ${i+1} / ${fs.length}`;
      try{const r=await owner.assets.upload(fs[i]);state.photos.push({id:r.id,url:r.url,caption:""})}
      catch(e){st.textContent=`「${fs[i].name}」を載せられませんでした（${e&&e.code||"エラー"}）。20MBまでの画像を選んでください。`}
    }
    file.value="";file.disabled=false;markDirty();renderGallery();
    st.textContent="追加しました。説明を書いたら「変更を保存して公開」を押してください。";
  });
  po.append(el("div",{class:"owner"},[el("h3",{text:"写真を追加（あなただけに表示）"}),el("div",{class:"row"},[file]),st]));

  const yo=$("#yt-owner");yo.hidden=false;yo.replaceChildren();
  const nm=el("input",{type:"text",id:"yt-name",value:state.youtube.name,placeholder:"チャンネル名","aria-label":"チャンネル名"});
  const ur=el("input",{type:"url",id:"yt-url",value:state.youtube.url,placeholder:"https://www.youtube.com/@…","aria-label":"チャンネルのURL"});
  nm.addEventListener("input",()=>{state.youtube.name=nm.value;markDirty()});
  ur.addEventListener("input",()=>{state.youtube.url=ur.value.trim();markDirty()});
  const vt=el("input",{type:"text",id:"vid-title",placeholder:"動画の題名","aria-label":"動画の題名"});
  const vu=el("input",{type:"url",id:"vid-url",placeholder:"動画のURL","aria-label":"動画のURL"});
  const list=el("ul",{class:"vids"});
  const drawList=()=>{list.replaceChildren();state.youtube.videos.forEach((v,i)=>list.append(el("li",{},[el("span",{text:v.title||v.url}),el("button",{class:"btn warn",type:"button",text:"外す",onclick:()=>{state.youtube.videos.splice(i,1);drawList();markDirty();renderYt()}})])))};
  drawList();
  const add=el("button",{class:"btn ghost",type:"button",text:"動画を加える",onclick:()=>{if(!safeUrl(vu.value.trim())){vu.focus();return}state.youtube.videos.push({title:vt.value.trim(),url:vu.value.trim()});vt.value="";vu.value="";drawList();markDirty();renderYt()}});
  yo.append(el("div",{class:"owner"},[el("h3",{text:"チャンネルの設定（あなただけに表示）"}),el("div",{class:"row"},[nm,ur]),el("h3",{text:"おすすめの動画"}),el("div",{class:"row"},[vt,vu,add]),list]));
  const bar=$("#owner-bar");bar.hidden=false;document.body.classList.add("owner-on");bar.replaceChildren(el("div",{class:"wrap row"},[el("span",{class:"status",text:"編集モード（あなただけに表示）"}),saveBtn,saveStatus]));
}

/* 自分自身を書き直して公開 */
function buildDoc(){
  const reset=(document.head.querySelector("style")||{textContent:""}).textContent;
  const json=JSON.stringify(state).replace(/</g,"\\u003c");
  const style=document.getElementById("page-style").textContent;
  const app=document.getElementById("app").textContent;
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'
   +'<title>Yellowmanの書斎</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n'
   +'<link rel="preconnect" href="https://fonts.googleapis.com">\n'
   +'<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Tinos&family=Yuji+Boku&display=swap">\n'
   +'<style id="page-style">'+style+'</style>\n'
   +'<template id="tpl">'+TPL.innerHTML+'</template>\n<div id="root"></div>\n'
   +'<script type="application/json" id="site-state">'+json+'</scr'+'ipt>\n'
   +'<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></scr'+'ipt>\n'
   +'<script id="app">'+app+'</scr'+'ipt>'
   +'</body></html>';
}
async function save(){
  if(!owner||!owner.artifact)return;
  saveBtn.setAttribute("disabled","");saveStatus.textContent="公開しています…";
  try{await owner.artifact.publish(buildDoc());dirty=false;saveStatus.textContent="公開しました。"}
  catch(e){
    const c=e&&e.code;
    saveStatus.textContent=c==="conflict"?"別の画面で先に更新されました。読み込み直してからもう一度お試しください。":c==="rate_limited"?"続けて保存しすぎました。少し待ってからもう一度押してください。":"公開できませんでした（"+(c||"エラー")+"）。";
    saveBtn.removeAttribute("disabled");
  }
}
window.addEventListener("beforeunload",e=>{if(dirty){e.preventDefault();e.returnValue=""}});

renderSongs();renderGallery();renderYt();renderComments();

(async()=>{
  if(!window.claude||!claude.use)return;
  const [assets,artifact,dl]=await Promise.all([claude.use("assets").catch(()=>null),claude.use("artifact").catch(()=>null),claude.use("downloads").catch(()=>null)]);
  downloads=dl;
  if(assets&&artifact){owner={assets,artifact};renderGallery();renderYt();renderOwner();renderSongOwner();renderComments();renderCommentOwner()}
  renderSongs();
})();
})();
</script>
