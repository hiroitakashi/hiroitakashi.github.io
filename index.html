<main>
  <section class="room" id="works">
    <div class="wrap">
      <div class="room-head">
        <h2>小説<span class="kana">WORKS</span></h2>
        <p>29作。いずれも縦書きの小説として書き下ろし、ドラマ脚本も用意しています。</p>
        <div class="backrow"><a class="back" href="index.html" aria-label="トップへ戻る"><span aria-hidden="true">‹</span> トップへ戻る</a></div>
      </div>
      <ul class="works" id="works-list"></ul>
      <div class="backrow bottom"><a class="back" href="index.html"><span aria-hidden="true">‹</span> トップへ戻る</a></div>
    </div>
  </section>

  <section class="room" id="songs">
    <div class="wrap">
      <div class="room-head">
        <h2>作曲<span class="kana">SONGS</span></h2>
        <p>SUNOで作った曲です。曲名を押すと、その場で聴けます。気に入った曲はダウンロードもできます。</p>
        <div class="backrow"><a class="back" href="index.html" aria-label="トップへ戻る"><span aria-hidden="true">‹</span> トップへ戻る</a></div>
      </div>
      <div id="songs-area"></div>
      <div id="song-owner" hidden></div>
      <div class="backrow bottom"><a class="back" href="index.html"><span aria-hidden="true">‹</span> トップへ戻る</a></div>
    </div>
  </section>

  <section class="room" id="photos">
    <div class="wrap">
      <div class="room-head">
        <h2>写真<span class="kana">PHOTOGRAPHS</span></h2>
        <p>自分の目で見て、自分で撮った風景です。フォルダを押すと、全画面のスライドショーで見られます（BGMは自作のインストゥルメンタルから）。</p>
        <div class="backrow"><a class="back" href="index.html" aria-label="トップへ戻る"><span aria-hidden="true">‹</span> トップへ戻る</a></div>
      </div>
      <div id="gallery-area"></div>
      <div id="photo-owner" hidden></div>
      <div class="backrow bottom"><a class="back" href="index.html"><span aria-hidden="true">‹</span> トップへ戻る</a></div>
    </div>
  </section>

  <section class="room" id="youtube">
    <div class="wrap">
      <div class="room-head">
        <h2>YouTube<span class="kana">CHANNEL</span></h2>
        <p>映像で綴っているチャンネルです。</p>
        <div class="backrow"><a class="back" href="index.html" aria-label="トップへ戻る"><span aria-hidden="true">‹</span> トップへ戻る</a></div>
      </div>
      <div class="yt" id="yt-area"></div>
      <div id="yt-owner" hidden></div>
      <div class="backrow bottom"><a class="back" href="index.html"><span aria-hidden="true">‹</span> トップへ戻る</a></div>
    </div>
  </section>
<section class="room" id="comments">
    <div class="wrap">
      <div class="room-head">
        <h2>コメント<span class="kana">LETTERS</span></h2>
        <p>小説や曲、写真へのご感想をお寄せください。いただいたコメントは、すべてこの欄で公開します。</p>
        <div class="backrow"><a class="back" href="index.html" aria-label="トップへ戻る"><span aria-hidden="true">‹</span> トップへ戻る</a></div>
      </div>
      <div class="cm-grid">
        <div id="cm-list"></div>
        <form class="cm-form" id="cm-form" novalidate>
          <h3>コメントを送る</h3>
          <label for="cm-name">お名前（ニックネーム可）</label>
          <input type="text" id="cm-name" maxlength="40" autocomplete="nickname">
          <label for="cm-about">どれについて</label>
          <input type="text" id="cm-about" maxlength="60" placeholder="例：小説『波頭』">
          <label for="cm-text">コメント</label>
          <textarea id="cm-text" rows="6" maxlength="2000"></textarea>
          <p class="cm-note">送られたコメントは、お名前とともにこのページで公開されます。</p>
          <div class="row"><button class="btn" type="submit" id="cm-send">メールで送る</button><button class="btn ghost" type="button" id="cm-copy">文面をコピー</button></div>
          <p class="status" id="cm-status" aria-live="polite"></p>
          <div class="mailbox">
            <span>受付アドレス</span>
            <code id="cm-addr">hiroitakashi@gmail.com</code>
            <button class="btn ghost" type="button" id="cm-addr-copy">アドレスをコピー</button>
          </div>
          <p class="cm-note">メールソフトが開かないときは、文面をコピーして上のアドレスへお送りください。</p>
        </form>
      </div>
      <div id="cm-owner" hidden></div>
      <div class="backrow bottom"><a class="back" href="index.html"><span aria-hidden="true">‹</span> トップへ戻る</a></div>
    </div>
  </section>
</main>
